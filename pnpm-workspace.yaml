# pnpm のサプライチェーン強化設定（pnpm 11 はこのファイルで設定を管理する）
#
# 依存パッケージのビルドスクリプト(postinstall 等)は既定で全て遮断する。
# ここで明示的に判断を記録しないと pnpm がエラーになるため、唯一ビルドを持つ
# agent-browser を false（実行しない）と明示する。
# agent-browser はプラットフォーム別バイナリを同梱し JS ランチャ経由で動くため、
# postinstall を実行しなくても問題なく動作する（=ビルドを走らせない方が安全）。
#
# なお「公開直後の版を避ける」minimumReleaseAge は pnpm 11 のデフォルトで有効なため
# 明示記述しない。依存は十分に枯れたバージョンへピン留めしている。
allowBuilds:
  agent-browser: false
