# このファイルがあることで .agents/tools/ が pnpm のワークスペースルートになる。
# 設定は .agents/tools/ 内に閉じるため、リポジトリ直下や poc/ には一切影響しない。
#
# 依存のビルドスクリプト(postinstall 等)は既定で全て遮断し、明示許可したものだけ実行する。
allowBuilds:
  # agent-browser は Rust 製 CLI バイナリを postinstall で配置するため許可する
  agent-browser: true
  # mcp-wordpress-server は dist/ を同梱せず prepare(=tsc build) で生成するため許可する
  mcp-wordpress-server@https://codeload.github.com/cloudbuilders-jp/mcp-wordpress-server/tar.gz/949a1e1f086f50462c4380bdc415c31e349dfe62: true
  # 以下は mcp-wordpress-server の推移的実行時依存。元の npx 方式でも実行されていた
  # ビルドスクリプト（sharp はネイティブバイナリ配置など）なので許可する。
  '@google/genai': true
  protobufjs: true
  sharp: true
